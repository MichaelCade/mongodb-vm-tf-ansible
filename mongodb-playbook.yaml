---
- hosts: mongo_nodes
  become: yes
  vars:
    mongo_keyfile_path: /etc/mongod.key
    mongo_keyfile_local_path: ./mongod.key
    replica_set_name: "rs"
    mongo_admin_user: "mongoadmin"
    mongo_admin_password: "Passw0rd999!"
    mongo_primary_host: "mongodb0.example.net"

  tasks:
    # ---------- Basic Network & System Setup ----------
    - name: Ensure DNS is configured
      copy:
        dest: /etc/resolv.conf
        content: |
          nameserver 8.8.8.8
          nameserver 8.8.4.4

    - name: Ensure default route exists
      command: ip route add default via 192.168.169.1
      when: "'default' not in ansible_facts['routes']"

    - name: Check network connectivity
      command: ping -c 4 google.com
      register: ping_result
      ignore_errors: yes

    - name: Fail if no network connectivity
      fail:
        msg: "No network connectivity. Please check your network settings."
      when: ping_result.rc != 0

    - name: Ensure dpkg is in consistent state
      command: dpkg --configure -a
      ignore_errors: yes

    - name: Update and upgrade apt packages
      apt:
        update_cache: yes
        upgrade: dist
        force_apt_get: yes
        allow_unauthenticated: yes

    # ---------- Install MongoDB ----------
    - name: Install prerequisites
      apt:
        name:
          - gnupg
          - curl
        state: present

    - name: Import MongoDB public GPG key
      ansible.builtin.shell: |
        curl -fsSL https://pgp.mongodb.com/server-7.0.asc | gpg -o /usr/share/keyrings/mongodb-server-7.0.gpg --dearmor
      args:
        creates: /usr/share/keyrings/mongodb-server-7.0.gpg

    - name: Add MongoDB repository
      copy:
        dest: /etc/apt/sources.list.d/mongodb-enterprise-7.0.list
        content: |
          deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-7.0.gpg ] https://repo.mongodb.com/apt/ubuntu jammy/mongodb-enterprise/7.0 multiverse

    - name: Reload local package database
      apt:
        update_cache: yes

    - name: Install MongoDB Enterprise and tools
      apt:
        name:
          - mongodb-enterprise
          - mongodb-enterprise-tools
        state: present

    # ---------- Keyfile Handling ----------
    - name: Generate MongoDB key file on primary node (only once)
      shell: openssl rand -base64 756 > {{ mongo_keyfile_path }}
      args:
        creates: "{{ mongo_keyfile_path }}"
      delegate_to: "{{ mongo_primary_host }}"

    - name: Fetch MongoDB key file from primary node
      fetch:
        src: "{{ mongo_keyfile_path }}"
        dest: "{{ mongo_keyfile_local_path }}"
        flat: yes
      delegate_to: "{{ mongo_primary_host }}"

    - name: Distribute MongoDB key file to all nodes
      copy:
        src: "{{ mongo_keyfile_local_path }}"
        dest: "{{ mongo_keyfile_path }}"
        owner: mongodb
        group: mongodb
        mode: '400'

    # ---------- MongoDB Configuration ----------
    - name: Create MongoDB configuration file
      copy:
        dest: /etc/mongod.conf
        content: |
          storage:
            dbPath: /var/lib/mongodb
          systemLog:
            destination: file
            logAppend: true
            path: /var/log/mongodb/mongod.log
          net:
            port: 27017
            bindIp: 127.0.0.1,{{ ansible_default_ipv4.address }}
          replication:
            replSetName: "{{ replica_set_name }}"
          security:
            authorization: "enabled"
            keyFile: "{{ mongo_keyfile_path }}"

    - name: Restart MongoDB service
      systemd:
        name: mongod
        state: restarted
        enabled: true

    # ---------- MongoDB Replica Set Initialization ----------
    - name: Check if MongoDB replica set is already initialized
      shell: |
        mongosh --quiet --host {{ mongo_primary_host }} --port 27017 --eval 'rs.status().ok'
      register: rs_status
      ignore_errors: yes

    - name: Initialize MongoDB replica set
      shell: |
        mongosh --host {{ mongo_primary_host }} --port 27017 --eval 'rs.initiate({
          _id: "{{ replica_set_name }}",
          members: [
            { _id: 0, host: "mongodb0.example.net:27017" },
            { _id: 1, host: "mongodb1.example.net:27017" },
            { _id: 2, host: "mongodb2.example.net:27017" }
          ]
        })'
      when: rs_status.rc != 0

    # ---------- Admin User Creation ----------
    - name: Check if MongoDB admin user exists
      shell: |
        mongosh --host {{ mongo_primary_host }} --port 27017 --quiet --eval 'db.getSiblingDB("admin").getUser("{{ mongo_admin_user }}")'
      register: admin_user
      ignore_errors: yes

    - name: Create MongoDB admin user
      shell: |
        mongosh --host {{ mongo_primary_host }} --port 27017 --eval 'db.getSiblingDB("admin").createUser({
          user: "{{ mongo_admin_user }}",
          pwd: "{{ mongo_admin_password }}",
          roles: [{ role: "root", db: "admin" }]
        })'
      when: admin_user.stdout == 'null'

    # ---------- Networking & Firewall ----------
    - name: Allow MongoDB port through firewall
      ufw:
        rule: allow
        port: 27017
        proto: tcp

    - name: Update /etc/hosts file
      lineinfile:
        path: /etc/hosts
        line: "{{ item }}"
      with_items:
        - "192.168.169.101 mongodb0.example.net"
        - "192.168.169.102 mongodb1.example.net"
        - "192.168.169.103 mongodb2.example.net"

    # ---------- Wait for MongoDB Primary ----------
    - name: Wait for MongoDB primary node to be ready
      shell: |
        timeout 600 bash -c 'until mongosh --host {{ mongo_primary_host }} --port 27017 --username {{ mongo_admin_user }} --password {{ mongo_admin_password }} --authenticationDatabase admin --eval "rs.status().members.filter(m => m.stateStr == \"PRIMARY\").length > 0" > /dev/null 2>&1; do
          sleep 10
        done'
      register: wait_result
      failed_when: wait_result.rc != 0

    - name: Debug primary readiness result
      debug:
        var: wait_result

